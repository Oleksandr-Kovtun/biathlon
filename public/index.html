<!DOCTYPE html>
<html>
<head>
    <title>Biathlon Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Результати стрільби</h2>
    
    <div class="controls">
        <strong>Приховати стовпці:</strong>
        <input type="checkbox" onclick="toggleCol(0)"> ID установки
        <input type="checkbox" onclick="toggleCol(1)"> Номер біатлоніста
        <input type="checkbox" onclick="toggleCol(2)"> Постріли
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">ID Установки</th>
                <th onclick="sortTable(1)">Номер</th>
                <th onclick="sortTable(2)">Постріли</th>
                <th>Мішені (Flaps)</th>
            </tr>
        </thead>
        <tbody>
            {% for row in results %}
            <tr>
                <td>{{ row.lane_id }}</td>
                <td>{{ row.number }}</td>
                <td>{{ row.shots }}</td>
                <td>
                    <div class="flap-container">
                        {% for flap in row.flaps %}
                        <div class="circle {{ 'hit' if flap == '1' else 'miss' }}"></div>
                        {% endfor %}
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        // Автоматичне оновлення сторінки кожні 5 секунд
        setTimeout(() => { location.reload(); }, 5000);

        function sortTable(n) {
            var table = document.getElementById("resultsTable");
            var rows = Array.from(table.rows).slice(1);
            var dir = table.getAttribute("data-dir") === "asc" ? "desc" : "asc";
            
            rows.sort((a, b) => {
                var x = a.cells[n].innerText.toLowerCase();
                var y = b.cells[n].innerText.toLowerCase();
                return dir === "asc" ? x.localeCompare(y, undefined, {numeric: true}) : y.localeCompare(x, undefined, {numeric: true});
            });
            
            rows.forEach(row => table.tBodies[0].appendChild(row));
            table.setAttribute("data-dir", dir);
        }

        function toggleCol(n) {
            var rows = document.getElementById("resultsTable").rows;
            for (var i = 0; i < rows.length; i++) {
                rows[i].cells[n].classList.toggle("hidden");
            }
        }
    </script>
</body>
</html>
